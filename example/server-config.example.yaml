# Logging configuration
log:
  consoleLevel: info
  fileLevel: info
  filePath: logs/server.log

# Database paths
database:
  mainDbPath: main.db
  saveGameDbPath: save.db

# HTTP / WebSocket server
httpServer:
  # 127.0.0.1: only programs on this computer connect. 0.0.0.0: any device on the local network
  # can too, for a client on another computer
  host: 127.0.0.1
  port: 8080
  maxMessageSize: 10485760
  rpcTimeoutMs: 5000
  clientToken: ""

# Text-to-speech (dummy | elevenlabs | openai)
tts:
  provider: dummy
  # elevenLabs:
  #   apiKey: ""
  #   model: eleven_multilingual_v2
  #   stability: 0.75
