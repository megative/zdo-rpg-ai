# Director
director:
  compactThreshold: 30
  compactKeepRecent: 10
  # Language NPCs speak in
  responseLanguage: Russian
  # Optional: who the player character is, e.g. "A former Imperial prisoner who arrived in Seyda Neen by boat."
  playerBackstory: ""
  # NPCs that remember the player greet them first, at most once per cooldown per NPC
  greetings: true
  greetingCooldownMinutes: 10
  # Every interval, with this chance, two NPCs near a quiet player chat with each other
  banter: true
  banterIntervalSeconds: 180
  banterChance: 0.5
  # After an NPC answers you, with this chance someone standing close who heard it may cut in
  interjections: true
  interjectionChance: 0.3
  # Who follows you says a word on arriving somewhere new and, every interval with this chance,
  # when it's been quiet
  companions: true
  companionTalkIntervalSeconds: 240
  companionTalkChance: 0.5
  # Alpha: NPCs may give small quests whose steps send you to other people you have met
  questChains: false

# LLM (dummy | gemini | openai)
# LLM providers: dummy | openai (any OpenAI-compatible API) | gemini | claude
llm:
