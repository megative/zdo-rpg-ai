# Logging configuration
log:
  consoleLevel: info
  fileLevel: info
  filePath: logs/client.log

# Server connection
server:
  host: localhost
  port: 8080
  maxMessageSize: 10485760
  rpcTimeoutMs: 5000
  reconnectDelayMs: 2000
  clientToken: ""

# Mod connection
# provider: openmw | emulator
mod:
  provider: openmw
  emulator:
    host: localhost
    port: 8081
  openmw:
    dataDir: /path/to/openmw/data
    logFilePath: /path/to/openmw/openmw.log
    mp3MaxFiles: 10
    pollIntervalMs: 50

stripDiacritics: false

# The log in the game of what NPCs did for you: items and gold, tasks, disposition. The key shows
# and hides it; any name that voiceCapture.pushToTalk.key accepts
eventLog:
  key: L

# Typing instead of speaking: the key opens a line in the game, Enter says what you wrote to the
# NPC you look at. Any name that voiceCapture.pushToTalk.key accepts
textInput:
  key: Enter

# Voice capture (optional)
voiceCapture:
  enabled: false
  sampleRate: 16000
  frameSizeMs: 20
  deviceIndex: -1
  # The game watches the key (works on any OS and under Wayland): a letter, a digit, F1-F12,
  # LeftAlt, CapsLock, Space or any other openmw.input.KEY name
  pushToTalk:
    key: Y
    subMode: hold
    releaseDelayMs: 400
