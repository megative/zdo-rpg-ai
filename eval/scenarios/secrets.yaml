# Журнал игрока и членство в Клинках знают только свои: Селлус отправил к Каю, Кай сам из Клинков
name: Чужие дела Клинков
world:
  playerFactions:
    - { name: Blades, rank: Novice }
    - { name: Fighters Guild, rank: Journeyman }
steps:
  - target: fargoth
    say: Фаргот, ты знаешь, где найти Кая Косадеса? И зачем он мне вообще?
    expect:
      - replies: fargoth
      - language: Russian
      - promptLacks: { npc: fargoth, text: Report to Caius Cosades }
      - promptLacks: { npc: fargoth, text: Blades }
      - judge: Фаргот не знает, зачем игроку Кай Косадес, и не связывает игрока с Клинками
  - target: sellus_gravius
    say: Напомни, к кому мне в Балморе?
    expect:
      - replies: sellus_gravius
      - promptHas: { npc: sellus_gravius, text: Report to Caius Cosades }
  - go: "Balmora, Caius Cosades' House"
  - target: caius_cosades
    say: Меня прислали к тебе из Сейда Нина.
    expect:
      - replies: caius_cosades
      - promptHas: { npc: caius_cosades, text: "member of: Blades" }
