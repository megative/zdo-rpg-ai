# Фаргот стоит рядом с Селлусом и слышит, как тот говорит про кольцо
name: Фаргот встревает
director: { interjections: true, interjectionChance: 1 }
steps:
  - target: sellus_gravius
    say: Селлус, это правда, что кто-то из стражи забрал кольцо Фаргота?
    expect:
      - replies: sellus_gravius
      - judge: Если Фаргот встрял, он говорит про своё кольцо и в своём характере, а не пересказывает Селлуса
